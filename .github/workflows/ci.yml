name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Contrato al día con el commit fijado de velora-api
        run: scripts/update-contract.sh --check
      - name: Compilar, pruebas y lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reportes
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
